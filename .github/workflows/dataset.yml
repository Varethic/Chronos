name: Dataset build

# Regenerating the corpus takes 10-15 minutes (it builds 50 needle-in-a-haystack
# contexts of ~130k tokens each and sandbox-verifies ~4,000 code samples), so this
# runs on demand rather than on every push.
on:
  workflow_dispatch:
    inputs:
      verify:
        description: "Run full AST and sandbox verification of every code record"
        type: boolean
        default: true

jobs:
  dataset:
    name: Build and verify corpus
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install requests httpx urllib3 aiohttp

      - name: Build training and holdout corpora
        run: python src/main.py dataset

      - name: Report manifest digest and sizes
        run: |
          python - <<'PY'
          import json, os
          for name in ("manifest", "train", "holdout"):
              path = os.path.join("src", "data", name + ".json" if name != "manifest" else "manifest.json")
              if name == "train":
                  path = os.path.join("src", "data", "traindata.json")
              if name == "holdout":
                  path = os.path.join("src", "data", "testdata.json")
              size = os.path.getsize(path)
              print(f"{name}: {size / 1048576:.1f} MB")
          data = json.load(open(os.path.join("src", "data", "manifest.json"), encoding="utf-8"))
          print("manifest:", json.dumps(data)[:500])
          PY

      - name: Upload manifest
        uses: actions/upload-artifact@v4
        with:
          name: corpus-manifest
          path: src/data/manifest.json
          retention-days: 14
