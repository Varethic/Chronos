name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify on ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Structural invariants and naming rules
        run: python src/main.py verify

      - name: Report bytes and version
        run: python -c "import sys, torch; print('python', sys.version.split()[0]); print('torch', torch.__version__); print('threads', torch.get_num_threads())"

  unit:
    name: Unit proofs on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      # Tokenizer losslessness, cache equivalence, sliding-window bounds,
      # masking, sandbox isolation, timeout enforcement, atomic persistence.
      - name: Run correctness proofs
        run: python src/main.py check

  syntax:
    name: Byte-compile all modules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile every source file
        run: python -m compileall -q src && echo "all modules compile"

      - name: Reject files that break the naming invariant
        run: |
          bad=$(find src docs -type f ! -name '*.pyc' | sed 's#^.*/##' | grep -E '[^a-z0-9.]' || true)
          if [ -n "$bad" ]; then
            echo "Filenames must be lowercase alphanumeric:"; echo "$bad"; exit 1
          fi
          echo "filenames compliant"

      - name: Reject stray large artifacts
        run: |
          # Only tracked files matter: the working tree may hold gitignored
          # checkpoints and corpora that were regenerated locally.
          big=$(git ls-files -z | xargs -0 -r -I{} sh -c 'test -f "{}" && s=$(wc -c < "{}") && test $s -gt 99614720 && echo "{} $s"' || true)
          if [ -n "$big" ]; then
            echo "Files above the GitHub 100 MB limit must not be committed:"; echo "$big"; exit 1
          fi
          echo "no oversized tracked artifacts"
